<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.url == "/" %}
  <title>Heejun Kim</title>
  {%- else %}
  <title>{{ page.title }} · Heejun Kim</title>
  {%- endif %}
  <meta name="description" content="{{ page.description | default: 'Heejun Kim. M.S. student at KAIST AI working on reasoning and efficient AI systems at the Scalable and Efficient AI Lab.' }}">
  <meta property="og:title" content="{% if page.url == '/' %}Heejun Kim{% else %}{{ page.title }} · Heejun Kim{% endif %}">
  <meta property="og:description" content="{{ page.description | default: 'Heejun Kim. M.S. student at KAIST AI working on reasoning and efficient AI systems.' }}">
  <meta property="og:type" content="website">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fbfbf8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23202a37'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='34' font-weight='600' fill='%23f4f4f2'%3EH%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Heejun Kim, home">Heejun Kim</a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/#publications' | relative_url }}">Publications</a>
      <a href="{{ '/projects.html' | relative_url }}"{% if page.url == "/projects.html" %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/docs/HeejunKim_CV.pdf' | relative_url }}" target="_blank" rel="noreferrer">CV</a>
    </nav>
  </header>

  <main class="page">
    {{ content }}
  </main>

  <footer class="site-footer shell">
    <div class="footer-brand">
      <strong>Heejun Kim</strong>
      <p>Scalable &amp; Efficient AI Lab, KAIST AI</p>
    </div>
    <div class="footer-meta">
      <p><a href="mailto:ya2298yay@gmail.com">ya2298yay@gmail.com</a></p>
      <p>© {{ site.time | date: "%Y" }} Heejun Kim</p>
    </div>
  </footer>

  <script>
    (function () {
      var items = document.querySelectorAll(".reveal");
      if (!("IntersectionObserver" in window)) {
        items.forEach(function (el) { el.classList.add("is-visible"); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          entry.target.classList.add("is-visible");
          io.unobserve(entry.target);
        });
      }, { rootMargin: "0px 0px -10% 0px", threshold: 0.08 });
      items.forEach(function (el) { io.observe(el); });
    })();
  </script>
</body>
</html>
